    <section class="page-hero">
      <div class="container">
        <div class="kicker" data-reveal="fade">{{packages_eyebrow}}</div>
        <h1 class="section-title" data-reveal="up"><span data-loc-title>{{packages_title}}</span></h1>
        <p class="section-lead" data-reveal="fade">{{packages_intro}}</p>
      </div>
    </section>

    <section class="packages-section packages-section--page" id="choose">
      <div class="container">
        <div class="loc-panel" data-loc-panel>
          <div class="loc-panel__head">
            <h2 class="loc-panel__title" data-loc-panel-title>{{loc_none_title}}</h2>
            <p class="section-lead">{{loc_lead}}</p>
          </div>
          <div class="loc-choose loc-choose--big" data-render="locations"></div>
        </div>
        <div class="tabs-row" data-loc-only hidden>
          <div class="tabs" data-tabs data-cat-tabs role="tablist">
            <button type="button" role="tab" class="is-on" data-tab="all">{{cat_all}}</button>
            <button type="button" role="tab" data-tab="personal">{{cat_personal}}</button>
            <button type="button" role="tab" data-tab="group">{{cat_group}}</button>
            <button type="button" role="tab" data-tab="saver">{{cat_saver}}</button>
          </div>
        </div>
        <div class="packages-grid" data-render="packages" data-group="category" data-loc-only hidden></div>
        <p class="pkg-note" data-loc-only hidden>{{pkg_note}}</p>
      </div>
    </section>

    <section class="join-cta">
      <div class="join-cta__inner">
        <h2>{{cta_title}}</h2>
        <p>{{cta_p}}</p>
        <a class="btn btn--petrol btn--lg" href="{{@/join}}">{{cta_btn}}</a>
      </div>
    </section>
