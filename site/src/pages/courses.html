    <section class="hero hero--figure hero--courses">
      <img class="hero__mark" src="/assets/mark-green.svg" alt="" aria-hidden="true">
      <div class="hero__inner">
        <div class="hero__content">
          <div class="kicker kicker--light" data-reveal="fade">{{courses_eyebrow}}</div>
          <h1 class="hero__title hero__title--md" data-reveal="up">{{courses_title}}</h1>
          <p class="hero__lead">{{courses_intro}}</p>
        </div>
        <figure class="hero__figure">
          <img src="/images/instructor.webp" alt="{{alt_instructor}}" width="560" height="890" fetchpriority="high" decoding="async">
        </figure>
      </div>
    </section>

    <section class="courses-section">
      <div class="container">
        <div class="courses-grid" data-render="courses"><div class="skeleton-row"><div class="skeleton skeleton--tall"></div></div></div>
      </div>
    </section>

    <section class="join-cta">
      <div class="join-cta__inner">
        <h2>{{course_cta_title}}</h2>
        <p>{{course_cta_p}}</p>
        <a class="btn btn--petrol btn--lg" href="{{@/join}}?interest=course">{{course_cta_btn}}</a>
      </div>
    </section>
