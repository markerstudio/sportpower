# إعداد الموقع العام على Vercel من GitHub Actions (يُشغَّل يدويًا)
# يحتاج سرًّا باسم VERCEL_TOKEN في Settings → Secrets and variables → Actions.
name: Vercel site setup

on:
  workflow_dispatch:
    inputs:
      production:
        description: "نشر الموقع إنتاجًا (لا معاينة فقط)"
        type: boolean
        default: true
      branch:
        description: "الفرع الذي يُنشر منه"
        type: string
        default: claude/arabic-sport-power-system-rm8wb2

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create the site project, set variables and domains, deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::السرّ VERCEL_TOKEN غير مضبوط — أضفه من Settings → Secrets and variables → Actions."
            exit 1
          fi
          node scripts/vercel-site-setup.js --branch "${{ inputs.branch }}" ${{ inputs.production && '--production' || '' }}
